# Render Blueprint: free Docker web service. https://render.com/docs/blueprint-spec
services:
  - type: web
    name: job-watcher
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8090"
      - key: JOB_WATCHER_PASSWORD
        generateValue: true
      - key: HF_TOKEN
        sync: false
      - key: JOB_WATCHER_BACKUP_REPO
        value: YashSingh1812/job-watcher-data
      # The free plan has 512 MB and a small CPU share: fewer checks at once, and no Chrome
      # (even one browser can push it past 512 MB; the few pages that need one are read via their feeds).
      - key: JOB_WATCHER_MAX_PARALLEL
        value: "6"
      - key: JOB_WATCHER_RENDER
        value: "0"
      # A deploy starts the new copy (which restores the backup) before stopping the old one,
      # so frequent backups keep what's lost on a deploy to a few minutes of checks.
      - key: JOB_WATCHER_BACKUP_MINUTES
        value: "5"
